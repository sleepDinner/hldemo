experiment:
  name: rfb_traceformer_final_train_data
  task: image_manipulation_localization
  output_dir: outputs/train_final_data_hybrid_cross_attention_hr

seed: 2026

device:
  accelerator: cuda
  distributed: false
  distributed_timeout_minutes: 120
  num_workers: 4
  pin_memory: true

data:
  train:
    name: FinalTrainData
    image_dir: /data0/lzb-change-vmunet/FinalTrainData/images
    mask_dir: /data0/lzb-change-vmunet/FinalTrainData/masks
    recursive: false
    strict_pairs: true
    skip_size_mismatch: true
    mask_suffixes: ["", "_mask", "_gt", "_label"]
  val:
    name: CASIA-D_val_manifest
    manifest_file: /data1/data/local/CASIA-D/CASIA-D_val_img_mask_cls.txt
    manifest_separator: " # "
    include_authentic: false
    skip_first: 0
  input_size: [512, 512]
  size_mismatch_policy: resize_mask
  batch_size: 4
  val_batch_size: 1
  drop_last: false
  augmentation:
    train:
      random_crop: true
      crop_size: [512, 512]
      hflip_prob: 0.5
      vflip_prob: 0.0
    test:
      random_crop: false
      hflip_prob: 0.0
      vflip_prob: 0.0
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

model:
  name: tamper_net
  in_channels: 3
  base_channels: 32
  decoder_channels: 64
  use_frequency_branch: true
  frequency_branch_type: hybrid
  fusion_type: cross_attention
  use_global_block: true
  use_boundary_head: true
  global_blocks: 2
  use_hr_refine: true
  hr_refine_channels: 32

loss:
  mask_bce_weight: 1.0
  dice_weight: 0.5
  boundary_weight: 0.3
  boundary_dice_weight: 0.5
  coarse_weight: 0.2
  coarse_dice_weight: 0.5
  image_weight: 0.1
  boundary_kernel_size: 5

training:
  amp: true
  max_grad_norm: 1.0
  sync_after_epoch: false

metrics:
  threshold: 0.5
  max_auc_pixels: 200000

optimizer:
  name: adamw
  lr: 0.0001
  weight_decay: 0.0001

scheduler:
  name: cosine
  epochs: 30
  warmup_epochs: 3

checkpoint:
  resume: null
  monitor: val_f1
  mode: max

logging:
  console: false
  server_log_file: /home/hl/train_hldemo.log
  log_interval: 20
  save_visualizations: true
  visualization_interval: 1
  max_visualizations: 8

