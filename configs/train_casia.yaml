experiment:
  name: rfb_traceformer_casia
  task: image_manipulation_localization
  output_dir: outputs/train_casia

seed: 2026

device:
  accelerator: cuda
  distributed: false
  num_workers: 4
  pin_memory: true

data:
  train:
    name: CASIA_train
    image_dir: data/CASIA/train/images
    mask_dir: data/CASIA/train/masks
    recursive: false
    strict_pairs: true
    mask_suffixes: ["", "_mask", "_gt", "_label"]
  val:
    name: CASIA_val
    image_dir: data/CASIA/val/images
    mask_dir: data/CASIA/val/masks
    recursive: false
    strict_pairs: true
    mask_suffixes: ["", "_mask", "_gt", "_label"]
  input_size: [512, 512]
  batch_size: 4
  val_batch_size: 1
  drop_last: false
  augmentation:
    train:
      random_crop: true
      crop_size: [512, 512]
      hflip_prob: 0.5
      vflip_prob: 0.0
    test:
      random_crop: false
      hflip_prob: 0.0
      vflip_prob: 0.0
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

model:
  name: tamper_net
  in_channels: 3
  base_channels: 32
  decoder_channels: 64
  use_frequency_branch: true
  use_global_block: true
  use_boundary_head: true
  global_blocks: 2

loss:
  mask_bce_weight: 1.0
  dice_weight: 0.5
  boundary_weight: 0.3
  coarse_weight: 0.2
  image_weight: 0.1
  boundary_kernel_size: 5

training:
  amp: true
  max_grad_norm: 1.0

metrics:
  threshold: 0.5
  max_auc_pixels: 200000

optimizer:
  name: adamw
  lr: 0.0001
  weight_decay: 0.0001

scheduler:
  name: cosine
  epochs: 100
  warmup_epochs: 5

checkpoint:
  resume: null
  save_best: true
  save_last: true
  monitor: val_f1
  mode: max

logging:
  log_interval: 20
  save_visualizations: true
  visualization_interval: 1
  max_visualizations: 8
